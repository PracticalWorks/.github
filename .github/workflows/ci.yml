name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  guard-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: pr-guard unit tests
        run: node --test scripts/pr-guard.test.mjs

  guard:
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/pr-guard.yml
    with:
      require-verification: true
      require-refs: true
