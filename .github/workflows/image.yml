name: image

on:
  workflow_call:
    inputs:
      image:
        description: GHCR image name, without a tag.
        required: true
        type: string
      runner:
        description: JSON array of runs-on labels.
        required: false
        type: string
        default: '["ubuntu-latest"]'
      context:
        required: false
        type: string
        default: "."
      file:
        description: Dockerfile path.
        required: false
        type: string
        default: Dockerfile
      platforms:
        description: buildx platforms. Empty builds the runner's own architecture.
        required: false
        type: string
        default: ""
      push:
        required: false
        type: boolean
        default: true
      npmrc:
        description: >-
          Mount the job token as an npmrc build secret so a Dockerfile can
          install private packages. Not a build-arg, so it stays out of image
          history. The job token is not a repository secret.
        required: false
        type: boolean
        default: false
      cache:
        description: inline, gha, or none.
        required: false
        type: string
        default: inline
      extra-tags:
        description: Extra image tags, one per line, after latest and the commit sha.
        required: false
        type: string
        default: ""
      timeout-minutes:
        required: false
        type: number
        default: 30

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ${{ fromJSON(inputs.runner) }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - uses: docker/setup-buildx-action@v3

      - id: tags
        env:
          IMAGE: ${{ inputs.image }}
          SHA: ${{ github.sha }}
          EXTRA: ${{ inputs.extra-tags }}
        run: |
          set -euo pipefail
          {
            echo "tags<<EOF"
            echo "${IMAGE}:latest"
            echo "${IMAGE}:${SHA}"
            if [ -n "${EXTRA}" ]; then
              printf '%s\n' "${EXTRA}"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.file }}
          push: ${{ inputs.push }}
          platforms: ${{ inputs.platforms }}
          tags: ${{ steps.tags.outputs.tags }}
          secrets: ${{ inputs.npmrc && format('npmrc=//npm.pkg.github.com/:_authToken={0}', github.token) || '' }}
          cache-from: ${{ inputs.cache == 'inline' && format('type=registry,ref={0}:latest', inputs.image) || (inputs.cache == 'gha' && 'type=gha' || '') }}
          cache-to: ${{ inputs.cache == 'inline' && 'type=inline' || (inputs.cache == 'gha' && 'type=gha,mode=max' || '') }}
