name: pr-guard

on:
  workflow_call:
    inputs:
      require-verification:
        description: Fail unless the body has a ## Verification heading.
        required: false
        type: boolean
        default: true
      require-refs:
        description: Fail unless the body has a Refs line naming an uppercase KEY-123.
        required: false
        type: boolean
        default: true
      scan-secrets:
        description: Fail if the pull request diff adds a high-confidence secret shape.
        required: false
        type: boolean
        default: false
      runner:
        description: JSON array of runs-on labels.
        required: false
        type: string
        default: '["ubuntu-latest"]'

permissions:
  contents: read

jobs:
  check:
    runs-on: ${{ fromJSON(inputs.runner) }}
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
        if: inputs.scan-secrets
        with:
          fetch-depth: 0

      # The script comes from the same commit as this workflow file, so a caller
      # pinned to a tag runs that tag's script. job.workflow_sha names the commit
      # of the file that defines this job (the reusable workflow, not the caller).
      # The fallback is only for a runner that leaves it empty; bump it with
      # each release tag.
      - uses: actions/checkout@v4
        with:
          repository: ${{ job.workflow_repository || 'PracticalWorks/.github' }}
          ref: ${{ job.workflow_sha || 'v1.2.0' }}
          path: .pw-shared

      - name: Warn when the runner gave no workflow sha
        if: job.workflow_sha == ''
        run: echo "::warning::job.workflow_sha is empty on this runner, so pr-guard ran the v1.2.0 script"

      # Self-hosted runners (Proxmox ephemeral) ship without node.
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: PR body and guardrails
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          REQUIRE_VERIFICATION: ${{ inputs.require-verification }}
          REQUIRE_REFS: ${{ inputs.require-refs }}
          SCAN_SECRETS: ${{ inputs.scan-secrets }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: node .pw-shared/scripts/pr-guard.mjs
